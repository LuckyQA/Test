<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lucky</title>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #ffe4e1; /* สีชมพูอ่อนพาสเทล */
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Patrick Hand', cursive;
      overflow: hidden;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 40px;
      box-shadow: 0 15px 35px rgba(255, 182, 193, 0.4);
      text-align: center;
      animation: bounceIn 1s ease;
    }

    .gif-container img {
      width: 200px;
      border-radius: 25px;
      margin-bottom: 20px;
      border: 5px solid #ffb6c1;
    }

    .text-container p {
      font-size: 28px;
      color: #ff6b81;
      margin-bottom: 20px;
    }

    .cute-button {
      background-color: #ff6b81;
      border: none;
      padding: 15px 40px;
      font-size: 22px;
      color: white;
      border-radius: 50px;
      cursor: pointer;
      font-family: 'Patrick Hand', cursive;
      transition: all 0.3s ease;
      box-shadow: 0 8px 0 #ee5253;
      animation: heartbeat 1.5s infinite;
    }

    .cute-button:hover {
      transform: translateY(-3px);
      background-color: #ff8797;
    }

    .cute-button:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #ee5253;
    }

    @keyframes bounceIn {
      0% { transform: scale(0.5); opacity: 0; }
      70% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes heartbeat {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="gif-container">
      <img src="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExeWN3ZGJ0MXdwdmI4ZHg2NW1kbXoxMTMwbng0bHd0eTlieDhtZDFyNCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/12wK5ab2fH2OLm/giphy.gif" alt="Cute GIF">
    </div>
    <div class="text-container">
      <p>กดข้างล่าง ❤️</p>
    </div>
    <button class="cute-button" id="Btn">กดตรงนี้</button>
  </div>

  <script>
    document.getElementById('Btn').addEventListener('click', () => {
      // เปลี่ยนลิงก์เป็น GitHub Pages ของคุณ
      window.location.href = 'https://lucky007-void.github.io/Test2/';
    });
  </script>
</body>
</html>
