<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lucky</title>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #ffe4e1;
      background-image: radial-gradient(#ffb6c1 1.5px, transparent 1.5px);
      background-size: 30px 30px;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Patrick Hand', cursive;
      overflow: hidden;
    }

    .container {
      background: rgba(255, 255, 255, 0.95);
      padding: 30px;
      border-radius: 40px;
      box-shadow: 0 15px 40px rgba(255, 107, 129, 0.3);
      text-align: center;
      border: 6px solid #ffffff;
      animation: bounceIn 1.2s cubic-bezier(0.68, -0.55, 0.27, 1.55), 
                 floating 3s ease-in-out infinite;
      position: relative;
      width: 85%;
      max-width: 400px;
    }

    .gif-container img {
      width: 100%;
      max-width: 200px;
      border-radius: 25px;
      margin-bottom: 20px;
      border: 4px solid #ffb6c1;
    }

    .text-container p {
      font-size: 26px;
      color: #ff6b81;
      margin-bottom: 25px;
      font-weight: bold;
    }

    .cute-button {
      background: linear-gradient(135deg, #ff6b81, #ff8797);
      border: none;
      padding: 15px 40px;
      font-size: 22px;
      color: white;
      border-radius: 100px;
      cursor: pointer;
      font-family: 'Patrick Hand', cursive;
      transition: all 0.3s ease;
      box-shadow: 0 8px 0 #ee5253, 0 10px 20px rgba(255, 107, 129, 0.3);
      animation: heartbeat 1.5s infinite;
      width: 100%;
    }

    @media (max-width: 480px) {
      .container { padding: 25px; }
      .text-container p { font-size: 22px; }
      .cute-button { font-size: 20px; padding: 12px 30px; }
    }

    @keyframes bounceIn {
      0% { transform: scale(0.3); opacity: 0; }
      70% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); }
    }

    @keyframes floating {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="gif-container">
      <img src="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExeWN3ZGJ0MXdwdmI4ZHg2NW1kbXoxMTMwbng0bHd0eTlieDhtZDFyNCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/12wK5ab2fH2OLm/giphy.gif" alt="Cute GIF">
    </div>
    <div class="text-container">
      <p>กดข้างล่าง</p>
    </div>
    <button class="cute-button" id="Btn">กดตรงนี้</button>
  </div>
  <script>
    document.getElementById('Btn').addEventListener('click', () => {
      window.location.href = 'https://lucky007-void.github.io/Test2/';
    });
  </script>
</body>
</html>
